# Local-only candidate. Docker runtime verification is required before release.
services:
  backend:
    build:
      context: .
      target: backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      FREIGHTGUARD_MODEL_PATH: /models/pipeline.joblib
      FREIGHTGUARD_TRUST_LOCAL_MODEL: "${FREIGHTGUARD_TRUST_LOCAL_MODEL:-false}"
      FREIGHTGUARD_MODEL_SHA256: "${FREIGHTGUARD_MODEL_SHA256:-}"
      FREIGHTGUARD_CORS_ORIGINS: "http://127.0.0.1:5173,http://localhost:5173"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    init: true
  frontend:
    build:
      context: .
      target: frontend
      args:
        VITE_API_BASE_URL: "${VITE_API_BASE_URL:-http://127.0.0.1:8000}"
    ports:
      - "127.0.0.1:5173:8080"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    init: true
